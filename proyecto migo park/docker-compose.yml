# Migo Park - Docker Desktop
# Ejecutar desde esta carpeta (la que contiene migo-park-backend y migo-park-frontend):
#   docker compose up --build
#
# Frontend: http://localhost:8080      Backend: http://localhost:4000/api/health

services:
  backend:
    build: ./migo-park-backend
    container_name: migo-park-backend
    ports:
      - "4000:4000"
    volumes:
      # El .env se monta (no se copia a la imagen). dotenv lo lee dentro del contenedor.
      - ./migo-park-backend/.env:/app/.env:ro
      # Datos que deben sobrevivir cuando se recrea el contenedor
      - ./migo-park-backend/uploads:/app/uploads
      - ./migo-park-backend/documentos-privados:/app/documentos-privados
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./migo-park-frontend
    container_name: migo-park-frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    restart: unless-stopped